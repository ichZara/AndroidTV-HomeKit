plugins {
    id 'com.android.application'
}

android {
    namespace 'uk.org.fancy.AndroidTvHomeKit'
    compileSdk 34

    defaultConfig {
        applicationId "uk.org.fancy.AndroidTvHomeKit"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        main.java.srcDirs += 'libs/hap/src/main/java'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }

    packaging {
        resources {
            excludes += [
                'META-INF/INDEX.LIST',
                'META-INF/io.netty.versions.properties',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt'
            ]
        }
    }
}

dependencies {
    implementation 'org.asynchttpclient:async-http-client:2.12.3'
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'com.nimbusds:srp6a:1.5.2'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.51'
    implementation 'net.vrallev.ecc:ecc-25519-java:1.0.3'
    implementation 'org.glassfish:javax.json:1.1.4'
    implementation 'javax.jmdns:jmdns:3.4.1'
    implementation 'commons-io:commons-io:2.16.1'
}
